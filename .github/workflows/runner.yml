name: Playwright Runner

on:
  workflow_dispatch:
    inputs:
      max_attempts:
        description: 'Jumlah percobaan (maxAttempts)'
        required: false
        default: '10'

jobs:
  run-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Script
        env:
          HEADLESS: "true"
          MAX_ATTEMPTS: ${{ github.event.inputs.max_attempts || '10' }}
        run: node main.js
